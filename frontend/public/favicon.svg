<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Branded IVC Cage favicon: rounded-square badge + microscope + cage bars + DHT signal dot -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#10b981" stroke-width="1.5"/>

  <!-- Cage bars (4 vertical bars) -->
  <g stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="14" y1="20" x2="14" y2="50"/>
    <line x1="22" y1="20" x2="22" y2="50"/>
    <line x1="42" y1="20" x2="42" y2="50"/>
    <line x1="50" y1="20" x2="50" y2="50"/>
  </g>
  <!-- Cage top/bottom rails -->
  <g stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="12" y1="20" x2="52" y2="20"/>
    <line x1="12" y1="50" x2="52" y2="50"/>
  </g>

  <!-- Microscope body (center) -->
  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Eyepiece -->
    <circle cx="32" cy="18" r="3.2" fill="url(#accent)"/>
    <!-- Arm + objective -->
    <path d="M32 22 L32 30 L28 34 L36 34 L32 30"/>
    <!-- Stage -->
    <line x1="26" y1="40" x2="38" y2="40"/>
    <!-- Base -->
    <path d="M22 46 L42 46"/>
  </g>

  <!-- DHT11 live signal dot (bottom-right) -->
  <circle cx="49" cy="49" r="3.5" fill="#34d399">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
