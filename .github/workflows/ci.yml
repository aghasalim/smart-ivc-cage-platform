name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Backend: pytest ────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt pytest

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Security scan — pip-audit (non-blocking)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true

  # ── ML pipeline: generate + train ──────────────────────────────────────────
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install ML deps
        working-directory: ai
        run: pip install -r requirements.txt

      - name: Generate dataset (small) and train
        working-directory: ai
        run: |
          python training/generate_dataset.py --rows 4000
          python training/train.py
          python training/compare_models.py

      - name: Security scan — pip-audit (non-blocking)
        working-directory: ai
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true

  # ── Frontend: type-check, lint, build ──────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Lint (non-blocking — add eslint to devDeps to enforce)
        working-directory: frontend
        run: |
          if npx --no-install eslint --version 2>/dev/null; then
            npx eslint . --max-warnings=0
          else
            echo "ESLint not installed — skipping lint step."
          fi
        continue-on-error: true

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Security scan — npm audit (non-blocking)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  # ── Cross-language verification of published metrics ───────────────────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: install R
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base > /dev/null
      - name: recompute
        run: bash verify/verify.sh
      - name: perturbation test
        run: |
          cp ai/reports/metrics.json /tmp/metrics.json.bak
          python3 -c "
          import json
          d = json.load(open('ai/reports/metrics.json'))
          d['test_macro_f1'] = 0.5
          json.dump(d, open('ai/reports/metrics.json', 'w'))
          "
          if bash verify/verify.sh 2>/dev/null; then
            echo "the corrupted metrics were accepted"
            cp /tmp/metrics.json.bak ai/reports/metrics.json
            exit 1
          fi
          echo "rejected as it should be"
          cp /tmp/metrics.json.bak ai/reports/metrics.json
          bash verify/verify.sh
